[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemarket-generator"
version = "0.1.0"
description = "Reproducible unique-token information markets with verified benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "networkx>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
